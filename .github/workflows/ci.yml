name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: List generated files
        run: ls -la dist/

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: react-build
          path: dist/

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
 
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: react-build
          path: dist/

      - name: List generated files
        run: ls -la dist/
      - name: Check Docker files
        run: |
          ls -la
          echo "===== nginx.conf ====="
          cat nginx.conf
          echo "===== Dockerfile ====="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app-front:${{ github.sha }}
