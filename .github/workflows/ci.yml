name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:  

      - name: Build application
        run: npm run build

      - name: List generated files
        run: ls -la dist/

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: react-build
          path: dist/